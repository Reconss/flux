.nav-icon{font-size:14px;width:20px;text-align:center}

.sfoot-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px;border-radius:9px;border:none;background:none;color:var(--text-m);font-size:11px;transition:all .14s}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:all .2s;position:relative}

.btt:hover{background:var(--surface2);color:var(--text)}

.editor-btn.danger{background:rgba(248,113,113,.15);color:#F87171}
.ie-block{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.ie-btns{display:flex;gap:8px}

{cat:'intl',name:'Reddit',url:'https://reddit.com',desc:'全球最大链接分享社区，几乎涵盖所有话题圈子。',tags:['英语社区']},
{cat:'intl',name:'Quora',url:'https://quora.com',desc:'英文高质量问答平台，专业人士聚集。',tags:['英语社区']},
{cat:'intl',name:'Medium',url:'https://medium.com',desc:'英文文章写作与阅读平台，深度内容聚集地。',tags:['英语社区']},
{cat:'intl',name:'Hacker News',url:'https://news.ycombinator.com',desc:'YC 旗下科技资讯社区，技术圈最重要讨论广场。',tags:['英语社区']},
{cat:'intl',name:'Wikipedia EN',url:'https://en.wikipedia.org',desc:'英文维基百科，全球最大知识数据库。',badge:'free',tags:['英语社区']},
{cat:'intl',name:'BBC',url:'https://bbc.com',desc:'英国广播公司，国际新闻权威媒体。',tags:['英文媒体']},
{cat:'intl',name:'The Verge',url:'https://www.theverge.com',desc:'科技媒体标杆，覆盖科技、文化、科学，报道质量高。',tags:['英文媒体']},
{cat:'intl',name:'知恵袋',url:'https://chiebukuro.yahoo.co.jp',desc:'日本最大知识问答社区，解决日语疑问必备。',tags:['日语社区']},
{cat:'intl',name:'はてな',url:'https://hatena.ne.jp',desc:'日本博客与问答平台，技术与文化内容丰富。',tags:['日语社区']},
{cat:'intl',name:'Naver',url:'https://naver.com',desc:'韩国最大搜索引擎与门户网站。',tags:['韩语社区']},
{cat:'intl',name:'Le Monde',url:'https://lemonde.fr',desc:'法国最具影响力日报，世界新闻高质量报道。',tags:['其他语言']},
{cat:'intl',name:'Der Spiegel',url:'https://spiegel.de',desc:'德国权威新闻周刊，欧洲政治经济深度报道。',tags:['其他语言']},
];
const CATS={ai:{label:'AI 工具',icon:'🤖'},dev:{label:'开发工具',icon:'💻'},edu:{label:'教育学习',icon:'📚'},tools:{label:'实用工具',icon:'🛠'},read:{label:'阅读书籍',icon:'📖'},media:{label:'影音娱乐',icon:'🎬'},audio:{label:'音乐播客',icon:'🎵'},game:{label:'游戏平台',icon:'🎮'},dl:{label:'软件下载',icon:'⬇️'},bt:{label:'BT 资源',icon:'🌊'},mob:{label:'移动应用',icon:'📱'},linux:{label:'Linux/macOS',icon:'🐧'},intl:{label:'国际社区',icon:'🌍'}};
let state={cat:'all',view:'grid',query:''};
let favorites=new Set(JSON.parse(localStorage.getItem('navhub-favs')||'[]'));
function buildNav(){const nav=document.getElementById('navWrap');const g={'内容 & 创作':[],'影音 & 娱乐':[],'资源 & 系统':[]};const m={ai:'内容 & 创作',dev:'内容 & 创作',edu:'内容 & 创作',tools:'内容 & 创作',read:'内容 & 创作',media:'影音 & 娱乐',audio:'影音 & 娱乐',game:'影音 & 娱乐',dl:'资源 & 系统',bt:'资源 & 系统',mob:'资源 & 系统',linux:'资源 & 系统',intl:'资源 & 系统'};let html='';let lastG='';const items=[{cat:'all',icon:'⊞',label:'全部网站'},{cat:'fav',icon:'⭐',label:'我的收藏'}];Object.entries(CATS).forEach(([k,v])=>items.push({cat:k,icon:v.icon,label:v.label}));items.forEach(item=>{if(item.cat==='all'||item.cat==='fav'){if(lastG){html+='</div>';lastG=''}}else{const g2=m[item.cat];if(g2!==lastG){if(lastG)html+='</div>';html+=`<div class="nav-group-label">${g2}</div>`;lastG=g2}}html+=`<button class="nav-item ${state.cat===item.cat?'active':''}" data-cat="${item.cat}" onclick="setNav('${item.cat}')"><span class="nav-icon">${item.icon}</span><span>${item.label}</span><span class="nav-count" id="nc-${item.cat}">0</span></button>`});if(lastG)html+='</div>';nav.innerHTML=html}
function setNav(cat){state.cat=cat;state.query='';document.getElementById('searchInput').value='';document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.cat===cat));render();window.scrollTo({top:0,behavior:'smooth'})}
function doSearch(v){state.query=v;state.cat='all';document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.cat==='all'));render()}
function setView(v){state.view=v;document.getElementById('vgrid').classList.toggle('active',v==='grid');document.getElementById('vlist').classList.toggle('active',v==='list');render()}
function toggleFav(e,url){e.preventDefault();e.stopPropagation();favorites.has(url)?favorites.delete(url):favorites.add(url);localStorage.setItem('navhub-favs',JSON.stringify([...favorites]));updateCounts();render()}
function toggleEditor(){const m=document.getElementById('editorModal');m.classList.toggle('open');if(m.classList.contains('open')){const sel=document.getElementById('editCat');sel.innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('')}}
function addSite(){const n=document.getElementById('editName').value.trim();let u=document.getElementById('editUrl').value.trim();const c=document.getElementById('editCat').value;const d=document.getElementById('editDesc').value.trim();const t=document.getElementById('editTags').value.split(',').map(x=>x.trim()).filter(Boolean);if(!n||!u){alert('名称和网址不能为空');return}if(!u.match(/^https?:\/\//))u='https://'+u;SITES.push({cat:c,name:n,url:u,desc:d,tags:t});localStorage.setItem('navhub-sites',JSON.stringify(SITES));updateCounts();render();alert('添加成功！')}
function saveSite(){const n=document.getElementById('editName').value.trim();const u=document.getElementById('editUrl').value.trim();const c=document.getElementById('editCat').value;const d=document.getElementById('editDesc').value.trim();const t=document.getElementById('editTags').value.split(',').map(x=>x.trim()).filter(Boolean);const i=SITES.findIndex(s=>s.url===u);if(i!==-1&&n&&u){SITES[i]={cat:c,name:n,url:u,desc:d,tags:t};localStorage.setItem('navhub-sites',JSON.stringify(SITES));updateCounts();render();alert('保存成功！')}}
function deleteSite(){const u=document.getElementById('editUrl').value.trim();if(!u)return;if(!confirm('确定删除？'))return;const i=SITES.findIndex(s=>s.url===u);if(i!==-1){SITES.splice(i,1);localStorage.setItem('navhub-sites',JSON.stringify(SITES));updateCounts();render();alert('删除成功！')}}
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('navhub-theme',d?'light':'dark')}
function updateCounts(){document.getElementById('totalNum').textContent=SITES.length;document.getElementById('favCount').textContent=favorites.size;['all','fav'].forEach(c=>{const e=document.getElementById('nc-'+c);if(e)e.textContent=c==='all'?SITES.length:favorites.size});Object.keys(CATS).forEach(c=>{const e=document.getElementById('nc-'+c);if(e)e.textContent=SITES.filter(s=>s.cat===c).length})}
function hostOf(url){try{return new URL(url).hostname}catch{return''}}
function buildCard(s){const isFav=favorites.has(s.url);const favBtn=`<button class="fav-btn ${isFav?'active':''}" onclick="toggleFav(event,'${s.url}')">${isFav?'★':'☆'}</button>`;const badge=s.badge?`<span class="card-badge">${s.badge.toUpperCase()}</span>`:'';const tags=(s.tags||[]).slice(0,2).map(t=>`<span class="ctag">${t}</span>`).join('');const host=hostOf(s.url);const favicon=host?`https://${host}/favicon.ico`:'';const ico=favicon?`<img src="${favicon}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='${s.name[0]}'">`:s.name[0];return`<a class="card" href="${s.url}" target="_blank" rel="noopener">${favBtn}${badge}<div class="card-top"><div class="card-ico">${ico}</div><div class="card-meta"><div class="card-name">${s.name}</div><div class="card-host">${host}</div><div class="card-tags-row">${tags}</div></div></div>${s.desc?`<div class="card-desc">${s.desc}</div>`:''}</a>`}
function render(){const c=document.getElementById('content');const q=state.query.toLowerCase();const lv=state.view==='list'?' list-view':'';if(q){const hits=SITES.filter(s=>s.name.toLowerCase().includes(q)||(s.desc||'').toLowerCase().includes(q)||s.url.toLowerCase().includes(q)||(s.tags||[]).some(t=>t.toLowerCase().includes(q)));const g={};hits.forEach(s=>{g[s.cat]=g[s.cat]||[];g[s.cat].push(s)});const order=Object.keys(CATS).filter(k=>g[k]);if(!order.length){c.innerHTML=`<div class="empty">没有找到 "${state.query}" 相关内容 🔍</div>`;return}c.innerHTML=order.map(cat=>{const m=CATS[cat];return`<div class="section"><div class="sec-hd"><div class="sec-dot"></div><span class="sec-title">${m.icon} ${m.label}</span><span class="sec-count">${g[cat].length} 个</span></div><div class="cards${lv}">${g[cat].map(buildCard).join('')}</div></div>`}).join('');return}if(state.cat==='fav'){const items=SITES.filter(s=>favorites.has(s.url));c.innerHTML=`<div class="section"><div class="sec-hd"><div class="sec-dot" style="background:#facc15"></div><span class="sec-title">⭐ 我的收藏</span><span class="sec-count">${items.length} 个</span></div><div class="cards${lv}">${items.length?items.map(buildCard).join(''):'<div class="empty">暂无收藏</div>'}</div></div>`;return}const cats=state.cat==='all'?Object.keys(CATS):[state.cat];c.innerHTML=cats.map(cat=>{const m=CATS[cat];const items=SITES.filter(s=>s.cat===cat);if(!items.length)return'';return`<div class="section"><div class="sec-hd"><div class="sec-dot"></div><span class="sec-title">${m.icon} ${m.label}</span><span class="sec-count">${items.length} 个</span></div><div class="cards${lv}">${items.map(buildCard).join('')}</div></div>`}).filter(Boolean).join('')}
window.addEventListener('scroll',()=>{document.getElementById('btt').classList.toggle('show',window.scrollY>300)});
(function(){const s=localStorage.getItem('navhub-sites');if(s){try{SITES.splice(0,SITES.length,...JSON.parse(s))}catch(e){}}const v=localStorage.getItem('navhub-view');if(v)state.view=v;const t=localStorage.getItem('navhub-theme');if(t)document.documentElement.setAttribute('data-theme',t);buildNav();updateCounts();render();document.getElementById('vgrid').classList.toggle('active',state.view==='grid');document.getElementById('vlist').classList.toggle('active',state.view==='list')})();
</script>
</body>
</html>
